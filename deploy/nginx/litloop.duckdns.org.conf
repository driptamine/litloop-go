# Nginx site for https://litloop.duckdns.org (managed manually on the VM).
# Copy to /etc/nginx/sites-enabled/litloop.duckdns.org.
#
# IMPORTANT: do NOT add `http2` to the 443 listener. Browsers negotiate
# HTTP/2 via ALPN and send the WebSocket handshake over it (RFC 8441),
# which Go's net/http server cannot upgrade — /ws/* then fails with 400
# and chat typing/presence/realtime stop working. HTTP/1.1 keeps the
# Upgrade flow intact.

map $http_upgrade $litloop_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name litloop.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://litloop.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name litloop.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/litloop.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litloop.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $litloop_connection_upgrade;
        proxy_request_buffering off;
    }
}
